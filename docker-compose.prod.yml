# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes from dev:
#   - DB port 5432 NOT exposed to host
#   - Memory limits on all containers
#   - API bound to loopback only (access via SSH tunnel)

# Collector logs: ~2 weeks at the busiest collector's rate (bybit ~4 MB/h raw). Rotated files are
# gzipped, so 30 × 50 MB of raw log costs ~0.2 GB on disk per collector.
x-collector-logging: &collector-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "30"
    compress: "true"

services:
  db:
    ports: !reset []
    # Bind-mount the Hetzner Cloud Volume (mounted at /mnt/pgvol on the host, ext4/noatime, persistent
    # via fstab) so the ts_1m tablespace lives on it (T-015). Container path matches migration 010's
    # CREATE TABLESPACE LOCATION. Appends to the base compose db volumes (pgdata + init.sql).
    volumes:
      - /mnt/pgvol:/mnt/pgvol
    deploy:
      resources:
        limits:
          memory: 2g

  collector-hyperliquid:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  collector-binance:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  collector-bybit:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  collector-okx:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  collector-coinbase:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  collector-dydx:
    logging: *collector-logging
    deploy:
      resources:
        limits:
          memory: 512m

  monitor:
    deploy:
      resources:
        limits:
          memory: 256m

  discovery:
    deploy:
      resources:
        limits:
          memory: 512m

  liquidations-hl:
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    ports: !override
      - "127.0.0.1:8000:8000"
    # !override replaces the base ports list. Loopback-only: Docker-published ports bypass UFW,
    # so a 0.0.0.0 bind is internet-reachable whatever UFW says.
    deploy:
      resources:
        limits:
          memory: 512m
