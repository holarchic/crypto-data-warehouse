# Exchange definitions for candle-collector v0.4
# Per-exchange: ccxt_class, btc_symbol, market_type, rate_limit_ms, enabled, supported_timeframes
# Per-timeframe: interval_s (poll interval), buffer_s (wait after candle close before fetch)

discovery:
  volume_threshold_usd: 1000000
  symbol_overrides:
    BCHSV: BSV
    LUNA2: LUNA

timeframes:
  5m:   { interval_s: 300,    buffer_s: 30 }
  15m:  { interval_s: 900,    buffer_s: 30 }
  30m:  { interval_s: 1800,   buffer_s: 30 }
  1h:   { interval_s: 3600,   buffer_s: 60 }
  2h:   { interval_s: 7200,   buffer_s: 60 }
  4h:   { interval_s: 14400,  buffer_s: 60 }
  12h:  { interval_s: 43200,  buffer_s: 120 }
  1d:   { interval_s: 86400,  buffer_s: 300 }
  3d:   { interval_s: 259200, buffer_s: 300 }
  1w:   { interval_s: 604800, buffer_s: 300 }

exchanges:
  hyperliquid:
    ccxt_class: hyperliquid
    btc_symbol: "BTC/USDC:USDC"
    market_type: perp
    # HL info endpoint has weight ~20; IP budget 1200 weight/min ⇒ ~1 req/sec.
    # 1100ms leaves a small margin under the cap and eliminates the 429 flood
    # that was causing hundreds of stale alerts on long TFs.
    rate_limit_ms: 1100
    enabled: true
    has_funding: true
    has_oi: true
    oi_poll_interval_s: 60          # HL OI 1-min (T-007.1; bulk metaAndAssetCtxs)
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 12h
      - 1d
      - 3d
      - 1w

  binance:
    ccxt_class: binanceusdm
    btc_symbol: "BTC/USDT:USDT"
    market_type: perp
    # Binance USDM budgets per *weight* not per request. fapi/v1/klines weight
    # scales with limit (limit<=1000 → weight 5). Setting a weight budget
    # routes this exchange through WeightRateLimiter, which paces against the
    # X-MBX-USED-WEIGHT-1M response header. rate_limit_ms is kept as a floor
    # but not the primary gate.
    rate_limit_ms: 100
    rate_limit_weight_budget: 2400   # Binance IP weight cap per minute
    rate_limit_window_s: 60
    rate_limit_safety: 400           # headroom for in-flight bursts at shared TF boundaries
    # Dense-OI weight lane (T-007.4): reserve of the usable cap for the priority dense burst so it
    # never blocks on the candle-kline burst at a mass settlement. Sized to the dense weight-RATE,
    # not the in-flight count — dense needs ~543 weight/min at a mass settlement (in-window symbols
    # × OI-weight), and `_used` is the server's rolling-minute weight, so a reserve of 100 (the
    # in-flight footprint, 6) was insufficient and re-verify FAILED. 600 ≥ the ~543/min rate ⇒
    # non-priority cap 2400−400−600=1400, and candle_cap(1400)+dense(543) < priority_cap(2000) ⇒
    # dense never stalls. The candle weight diet (adaptive kline `limit`, collector/candles.py)
    # shrinks the candle burst ~5× so this larger reserve is nearly free. 0 = lane off (rollback).
    rate_limit_priority_reserve: 600
    enabled: true
    has_funding: true
    has_oi: true
    has_liquidation_ws: true         # !forceOrder@arr all-market liquidation stream (Grade C, T-009.2)
    has_premium_index: true          # premiumIndexKlines 5m poll → premium_index (T-010)
    # OI two-source (T-007.2): dense-tick 60s (sized to halve peak OI weight at a mass
    # settlement — the dense burst shares this exchange's weight limiter with candles);
    # ±15m settlement window; per-symbol openInterestHist baseline refresh ~30m.
    oi_poll_interval_s: 60
    oi_settlement_window_s: 900
    oi_baseline_interval_s: 1800
    oi_dense_concurrency: 6          # parallel per-symbol dense fetch (mass settlement ~541 syms)
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 12h
      - 1d
      - 3d
      - 1w

  bybit:
    ccxt_class: bybit
    btc_symbol: "BTC/USDT:USDT"
    market_type: perp
    rate_limit_ms: 100
    enabled: true
    has_funding: true
    has_oi: true
    has_liquidation_ws: true         # allLiquidation.{sym} per-symbol liquidation stream (Grade C, T-009.2)
    oi_poll_interval_s: 30          # bulk fetch_tickers (OI+USD), 1 call/cycle → flat 30s
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 12h
      - 1d
      - 1w

  okx:
    ccxt_class: okx
    btc_symbol: "BTC/USDT:USDT"
    market_type: perp
    rate_limit_ms: 100
    enabled: true
    has_funding: true
    has_oi: true
    oi_poll_interval_s: 30          # bulk fetch_open_interests (+ price map for USD), flat 30s
    options:
      defaultType: swap
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 12h
      - 1d
      - 1w

  coinbase:
    ccxt_class: coinbase
    btc_symbol: "BTC/USD"
    market_type: spot
    rate_limit_ms: 200
    enabled: true
    has_funding: false
    has_oi: false
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 1d

  dydx:
    ccxt_class: dydx
    btc_symbol: "BTC/USDC:USDC"
    market_type: perp
    rate_limit_ms: 200
    enabled: true
    has_funding: true
    has_oi: false
    supported_timeframes:
      - 5m
      - 15m
      - 30m
      - 1h
      - 4h
      - 1d
