[project]
name = "candle-collector"
version = "0.7.0"
requires-python = ">=3.12"
# Runtime deps — union of collector/requirements.txt + api/requirements.txt (the
# per-container Docker source of truth). Declared here so `uv run` (the pre-commit
# hook) resolves the same imports the tests exercise; keep the floors in sync with
# those two files.
dependencies = [
    "ccxt>=4.5.63",  # 4.5.47 crashed on okx load_markets (keysort None id); 4.5.63 fixes it
    "cryptography>=44.0.0",
    "psycopg>=3.2",
    "psycopg_pool>=3.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "websocket-client>=1.8",  # T-009.1 WS collector infra (collector/ws.py)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyarrow>=17",  # T-011.1 /export/parquet — same lib the backtester reads the seed + hashes with
    "boto3>=1.43.40",
    "lz4>=4.4.5",
]

[tool.pytest.ini_options]
pythonpath = ["collector", "api"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
