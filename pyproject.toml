[project]
name = "candle-collector"
version = "0.4.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["collector", "api"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
