x-collector-common: &collector-common
  build: ./collector
  depends_on:
    db:
      condition: service_healthy
  environment: &collector-env
    POSTGRES_USER: ${POSTGRES_USER:-candles}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
  restart: always

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-candles} -d ${POSTGRES_DB:-candle_collector}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  collector-hyperliquid:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: hyperliquid

  collector-binance:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: binance

  collector-bybit:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: bybit

  collector-okx:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: okx

  collector-coinbase:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: coinbase

  collector-dydx:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: dydx

  discovery:
    <<: *collector-common
    profiles: ["discovery"]
    command: ["python", "-m", "discovery"]
    restart: "no"

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
    restart: always

volumes:
  pgdata:
