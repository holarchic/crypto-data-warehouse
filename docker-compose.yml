x-collector-common: &collector-common
  build: ./collector
  depends_on:
    db:
      condition: service_healthy
  environment: &collector-env
    POSTGRES_USER: ${POSTGRES_USER:-candles}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
  restart: always

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
    command: ["-c", "max_connections=150"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-candles} -d ${POSTGRES_DB:-candle_collector}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  collector-hyperliquid:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: hyperliquid

  collector-binance:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: binance

  collector-bybit:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: bybit

  collector-okx:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: okx

  collector-coinbase:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: coinbase

  collector-dydx:
    <<: *collector-common
    environment:
      <<: *collector-env
      EXCHANGE: dydx

  monitor:
    <<: *collector-common
    command: ["python", "-m", "monitor"]
    environment:
      <<: *collector-env
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      MONITOR_INTERVAL_S: ${MONITOR_INTERVAL_S:-300}
      ALERT_COOLDOWN_S: ${ALERT_COOLDOWN_S:-3600}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      HEARTBEAT_HOUR_UTC: ${HEARTBEAT_HOUR_UTC:-0}
      HEARTBEAT_DAY_UTC: ${HEARTBEAT_DAY_UTC:-0}   # weekly status ping: 0=Mon … 6=Sun
      ALARMING_DELTA_THRESHOLD: ${ALARMING_DELTA_THRESHOLD:-25}
      ALARMING_SUSTAIN_CYCLES: ${ALARMING_SUSTAIN_CYCLES:-3}
      ALARMING_ERROR_THRESHOLD: ${ALARMING_ERROR_THRESHOLD:-3}

  discovery:
    <<: *collector-common
    profiles: ["discovery"]
    command: ["python", "-m", "discovery"]
    restart: "no"

  # HL Grade-A liquidation daily pull (T-009.3) — one-shot batch from the requester-pays node_fills S3
  # tape, run by cron. The job exits 2 if the AWS creds are missing from .env (checked in
  # liquidations_hl.main, not `:?` here — compose interpolates every service, profiled or not).
  liquidations-hl:
    <<: *collector-common
    profiles: ["liquidations-hl"]
    command: ["python", "-m", "liquidations_hl"]
    environment:
      <<: *collector-env
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    restart: "no"

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-candle_collector}
    restart: always

volumes:
  pgdata:
